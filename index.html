<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WVSU CIT 240 - Developer Directory</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        header { text-align: center; margin-bottom: 40px; padding: 20px; background-color: #003366; color: white; border-radius: 8px; }
        header h1 { margin: 0; font-size: 2rem; }
        header p { margin: 5px 0 0; opacity: 0.9; }
        .directory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-top: 4px solid #0056b3; }
        .card h3 { margin: 0 0 5px 0; color: #003366; }
        .card .role { font-size: 0.85rem; color: #666; font-weight: bold; text-transform: uppercase; margin-bottom: 12px; }
        .card .bio { font-size: 0.95rem; line-height: 1.4; margin-bottom: 15px; }
        .card a { display: inline-block; text-decoration: none; color: white; background-color: #0056b3; padding: 6px 12px; border-radius: 4px; font-size: 0.85rem; }
        .card a:hover { background-color: #003d82; }
    </style>
</head>
<body>

    <header>
        <h1>WVSU CIT 240: Open Source Programming</h1>
        <p>Official Class Contributor Directory</p>
    </header>

    <div class="directory-grid">

        <!-- INSTRUCTOR CARD (Use this block as your template!) -->
        <div class="card">
            <h3>Luke Sarco Araquil</h3>
            <div class="role">Course Instructor</div>
            <p class="bio">Teaching Open Source Programming and building collaborative software at WVSU.</p>
            <a href="https://github.com/" target="_blank">GitHub Profile</a>
        </div>
        <!-- END INSTRUCTOR CARD -->

        <!-- ========================================================= -->

        <!-- ========================================================= -->



    </div>

</body>
</html>
